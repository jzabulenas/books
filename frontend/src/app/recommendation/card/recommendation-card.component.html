<mat-card>
  <mat-card-header>
    <mat-card-title data-testid="book-title">{{ recommendation().title }}</mat-card-title>

    @if (recommendation().author) {
      <mat-card-subtitle data-testid="book-author">{{ recommendation().author }}</mat-card-subtitle>
    }
  </mat-card-header>

  @if (recommendation().description) {
    <mat-card-content>
      <p data-testid="description">{{ recommendation().description }}</p>
    </mat-card-content>
  }

  <mat-card-actions>
    <button mat-button (click)="onSave()">Save for later</button>

    <button mat-button (click)="onBlock()">Don't suggest again</button>
  </mat-card-actions>
</mat-card>
