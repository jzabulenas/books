<mat-card>
  <mat-card-header>
    <mat-card-title data-testid="book-title">{{ savedBook().title }}</mat-card-title>

    @if (savedBook().author) {
      <mat-card-subtitle data-testid="book-author">{{ savedBook().author }}</mat-card-subtitle>
    }
  </mat-card-header>

  <mat-card-actions>
    <button mat-button (click)="onMarkRead()">Mark as read</button>
    <button mat-button (click)="onRemove()">Remove</button>
  </mat-card-actions>
</mat-card>
