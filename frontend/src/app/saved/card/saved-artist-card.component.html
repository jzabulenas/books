<mat-card>
  <mat-card-header>
    <mat-card-title data-testid="artist-name">{{ savedArtist().name }}</mat-card-title>

    @if (savedArtist().genre) {
      <mat-card-subtitle data-testid="artist-genre">{{ savedArtist().genre }}</mat-card-subtitle>
    }
  </mat-card-header>

  <mat-card-actions>
    <button mat-button (click)="onLike()">Like</button>
    <button mat-button (click)="onRemove()">Remove</button>
  </mat-card-actions>
</mat-card>
